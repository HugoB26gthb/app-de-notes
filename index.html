<script>
/* Standalone build: the app runs on its own (no Claude around it).
   Notes are kept on this device only; files are saved with the system share sheet or a normal download;
   the AI assistant is not connected yet. */
window.NX_STANDALONE = true;
window.claude = {
  use: async name => name !== 'downloads' ? null : {
    save: async ({filename, data}) => {
      const type = /\.pdf$/i.test(filename) ? 'application/pdf' : 'application/json';
      const blob = data instanceof Blob ? data : new Blob([data], {type});
      const file = new File([blob], filename, {type});
      /* on iPhone the share sheet is the reliable way to keep a file ("Enregistrer dans Fichiers") */
      if (navigator.canShare && navigator.canShare({files: [file]})){
        try { await navigator.share({files: [file]}); return {status: 'saved'}; }
        catch (e){ if (e && e.name === 'AbortError') throw {code: 'declined'}; }
      }
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
      return {status: 'saved'};
    }
  }
};
/* ask the browser not to clear the app's storage on its own */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>

/* Layout: dark "night glass" phone app, one column; tab screens + full-screen pages pushed on top; tab bar at the bottom, round + floating above Profil */
/* skin "bleu" (default) — the other skins (blanc, gris, noir) redefine the same tokens via data-skin */
:root{

}
:root[data-skin="noir"]{
  --bg:#000000; --text:#F2F2F2; --muted:#9A9A9A; --dim:#616161;
  --glow-a:rgba(255,255,255,.08); --glow-b:rgba(255,255,255,.03); --glow-c:rgba(255,255,255,.05);
  --glass:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025)); --glass-flat:rgba(255,255,255,.045);

  --stroke:rgba(220,228,240,.14); --stroke-hi:rgba(220,228,240,.40); --grid:rgba(220,228,240,.10);
  --accent:#AEB8C8; --accent-2:#DCE3EE; --glow:rgba(200,212,230,.25); --on-accent:#FFFFFF;
  --seg-grad:linear-gradient(180deg,#5A6372,#3A414C); --btn-grad:linear-gradient(90deg,#353B45,#5B6574 50%,#353B45);
  --fab-grad:radial-gradient(circle at 50% 30%,#6E7887,#343A44);
  --ico-bg:radial-gradient(circle at 50% 30%,rgba(220,228,240,.16),rgba(20,22,26,.5)); --ico-fg:#E6EBF2;
  --bar-bg:rgba(30,33,38,.88); --toast-bg:rgba(52,57,66,.96); --toast-fg:#EEF1F5; --chip-on:rgba(220,228,240,.14);
  --ring-a:#E9EEF5; --ring-b:#7D8796; --point:#FFFFFF; --shadow:rgba(0,0,0,.3);

  --glass:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.75)); --glass-flat:rgba(255,255,255,.78);
  --stroke:rgba(40,70,130,.12); --stroke-hi:rgba(47,111,224,.45); --grid:rgba(40,70,130,.10);
  --accent:#2F6FE0; --accent-2:#2F6FE0; --glow:rgba(47,111,224,.28); --on-accent:#FFFFFF;
  --seg-grad:linear-gradient(180deg,#3B7CEB,#2357C4); --btn-grad:linear-gradient(90deg,#2357C4,#3B7CEB 50%,#2357C4);
  --fab-grad:radial-gradient(circle at 50% 30%,#4A8AF2,#1F4FB3);
  --ico-bg:radial-gradient(circle at 50% 30%,rgba(47,111,224,.14),rgba(255,255,255,.9)); --ico-fg:#2357C4;
  --bar-bg:rgba(255,255,255,.9); --toast-bg:rgba(15,26,51,.92); --toast-fg:#FFFFFF; --chip-on:rgba(47,111,224,.12);
  --ring-a:#7FB2FF; --ring-b:#2357C4; --point:#2357C4; --shadow:rgba(30,60,120,.08);

}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--text);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 55% at 70% -8%,var(--glow-a),transparent 62%),
             radial-gradient(70% 40% at 0% 40%,var(--glow-b),transparent 70%),
             radial-gradient(90% 50% at 100% 105%,var(--glow-c),transparent 65%),var(--bg);
  background-color:var(--bg);background-attachment:fixed}
body.paged{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:10px}
svg{flex:none}
.screen{max-width:480px;margin:0 auto;padding-inline:18px;padding-block:22px 150px;display:flex;flex-direction:column;gap:14px}

/* type */
.h1{font-size:28px;font-weight:400;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lead{color:var(--muted);font-size:14px;margin:2px 0 0}
.h2{font-size:17px;font-weight:500;margin:6px 0 0;display:flex;justify-content:space-between;align-items:center}
.h2 button{color:var(--muted);display:flex}
.lab{font-size:15px;font-weight:500;margin:4px 0 -4px}
.hint{color:var(--muted);font-size:13px;margin:0}
.num{font-variant-numeric:tabular-nums}
.of{color:var(--muted);font-size:.55em;font-weight:300}

/* glass surfaces */
.card{background:linear-gradient(180deg,var(--sheen),transparent 42%),var(--glass);border:1px solid var(--stroke);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:8px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--stroke-hi);display:grid;place-items:center;color:var(--text);background:var(--glass-flat);box-shadow:0 0 14px var(--glow);font-weight:500}

/* MG hero card */
.mgcard{position:relative;overflow:hidden;padding:16px;min-height:118px}
.mgcard .lbl{font-size:14px;color:var(--text)}
.mgcard .lbl small{color:var(--muted);font-size:12px;margin-left:4px}
.mgcard .big{font-size:42px;font-weight:300;margin-top:8px;letter-spacing:-.01em}
.mgcard .spark{position:absolute;right:0;bottom:0;width:62%;height:78px}
.trend{font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.trend.up{color:var(--up)} .trend.down{color:var(--down)} .trend.flat{color:var(--muted)}
.mgcard .trend{position:absolute;top:16px;right:16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:10px 8px;text-align:center}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:22px;font-weight:400;margin-top:2px}

/* rows */
.srow{width:100%;display:grid;grid-template-columns:44px 1fr auto 14px;gap:12px;align-items:center;padding:10px 12px;text-align:left;border-radius:14px}
.srow+.srow{margin-top:8px}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--stroke-hi);background:var(--ico-bg);color:var(--ico-fg);box-shadow:0 0 10px var(--glow)}
.ico.sm{width:32px;height:32px}
.srow .t{min-width:0}
.srow .t b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .t small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .v{text-align:right;font-size:17px;font-weight:400;white-space:nowrap}
.srow .v small{display:block;font-size:11.5px;color:var(--muted)}
.chev{color:var(--muted);display:flex}
.mp-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent);margin-left:6px;vertical-align:middle}
.c-bad{color:var(--down)} .c-good{color:var(--up)} .c-none{color:var(--dim)}

/* segmented */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass-flat);border:1px solid var(--stroke)}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{color:var(--on-accent);background:var(--seg-grad);border:1px solid var(--stroke-hi);box-shadow:0 0 16px var(--glow),inset 0 1px 0 rgba(255,255,255,.15)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--stroke);font-size:12.5px;color:var(--muted);background:var(--glass-flat)}
.pill.on{color:var(--text);border-color:var(--stroke-hi);box-shadow:0 0 10px var(--glow)}

/* tab bar + fab */
/* ===== Liquid Glass tab bar: floating capsule + sliding glass selection ===== */
:root{--lg-tint:rgba(16,28,58,.38);--lg-top:rgba(255,255,255,.13);--lg-edge:rgba(255,255,255,.16);--lg-hi:rgba(255,255,255,.32);--lg-ink:#F2F7FF;--lg-ink-off:rgba(225,235,255,.62);
  --lg-pill:rgba(120,180,255,.16);--lg-pill-hi:rgba(255,255,255,.42);--lg-rim-a:rgba(110,225,255,.45);--lg-rim-b:rgba(160,140,255,.30);--lg-shadow:rgba(0,0,0,.5);--lg-solid:rgba(10,18,38,.94);--lg-pill-fill:rgba(34,58,108,.94);--lg-fab-tint:rgba(28,52,104,.55)}
:root[data-skin="noir"]{--lg-tint:rgba(18,18,22,.42);--lg-pill:rgba(255,255,255,.12);--lg-rim-a:rgba(200,240,255,.35);--lg-rim-b:rgba(200,200,255,.22);--lg-solid:rgba(12,12,14,.94);--lg-pill-fill:rgba(40,40,46,.95);--lg-fab-tint:rgba(40,40,46,.55)}
:root[data-skin="gris"]{--lg-tint:rgba(52,57,66,.40);--lg-pill:rgba(255,255,255,.14);--lg-solid:rgba(40,44,52,.94);--lg-pill-fill:rgba(72,78,90,.95);--lg-fab-tint:rgba(72,78,90,.55)}
:root[data-skin="blanc"]{--lg-tint:rgba(255,255,255,.50);--lg-top:rgba(255,255,255,.75);--lg-edge:rgba(20,40,90,.12);--lg-hi:rgba(255,255,255,.95);--lg-ink:#0F1A33;--lg-ink-off:rgba(15,26,51,.58);
  --lg-pill:rgba(47,111,224,.12);--lg-pill-hi:rgba(255,255,255,.95);--lg-rim-a:rgba(10,163,190,.40);--lg-rim-b:rgba(130,110,240,.25);--lg-shadow:rgba(30,60,120,.22);--lg-solid:rgba(250,252,255,.96);--lg-pill-fill:rgba(236,243,255,.96);--lg-fab-tint:rgba(255,255,255,.58)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar-in{pointer-events:auto;position:relative;isolation:isolate;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;border-radius:999px;
  background:linear-gradient(180deg,var(--lg-top),transparent 45%,rgba(255,255,255,.03)),var(--lg-tint);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--lg-edge);
  box-shadow:inset 0 1px 0 var(--lg-hi),inset 0 -1px 0 rgba(255,255,255,.05),inset 1px 0 0 rgba(255,255,255,.07),inset -1px 0 0 rgba(255,255,255,.07),inset 0 0 24px rgba(70,200,255,.05),0 18px 40px var(--lg-shadow),0 2px 8px rgba(0,0,0,.18)}
/* specular light on the upper rim and cool reflections on the sides: the "thickness" of the glass */
.tabbar-in::before{content:"";position:absolute;inset:1px;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(90% 70% at 50% -30%,rgba(255,255,255,.16),transparent 60%),linear-gradient(90deg,rgba(110,200,255,.10),transparent 16%,transparent 84%,rgba(110,200,255,.10))}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tabbar-in{background:linear-gradient(180deg,var(--lg-top),transparent 45%),var(--lg-solid)}}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;font-weight:500;color:var(--lg-ink-off);border-radius:999px;
  transition:color var(--d2) var(--ease),transform var(--d1) var(--ease),opacity var(--d1) var(--ease)}
.tab svg{transition:transform var(--d2) var(--ease),filter var(--d2) var(--ease)}
.tab.on{color:var(--lg-ink)}
.tab.on svg{filter:drop-shadow(0 0 6px var(--lg-rim-a));transform:translateY(-1px)}
.tab:active{transform:scale(.93)}
@media (hover:hover){.tab:not(.on):hover{color:var(--lg-ink)}}
.tab:focus-visible{outline:2px solid var(--cyan);outline-offset:-3px}
/* the glass selection capsule: slides between tabs, stretches a little like liquid while moving */
.tab-pill{position:absolute;left:0;top:6px;bottom:6px;width:0;z-index:2;pointer-events:none;border-radius:999px;
  transition:transform 460ms cubic-bezier(.3,1.22,.5,1),width 460ms cubic-bezier(.3,1.22,.5,1)}
.tab-pill-in{position:absolute;inset:0;border-radius:inherit}
.tab-pill-body{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 52%,rgba(120,210,255,.10)),var(--lg-pill-fill);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 var(--lg-pill-hi),inset 1px 0 0 var(--lg-rim-a),inset -1px 0 0 var(--lg-rim-b),inset 0 -3px 8px rgba(70,200,255,.14),0 6px 16px rgba(0,0,0,.28),0 0 18px -6px var(--lg-rim-a)}
.tab-pill-body::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);opacity:0}
.tab-pill.moving .tab-pill-body,.tab-pill.moving .tab-pill-glare{animation:liquid 460ms cubic-bezier(.3,.7,.4,1)}
.tab-pill.moving .tab-pill-body::after{animation:sheen 520ms ease-out}
/* the lens: magnified copy of the bar with soft red/cyan fringes, like light bent by a drop of water */
.tab-pill-lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
/* drawn at the magnified size (not scaled with transform) so the text stays sharp; only moved sideways */
.lens-row{--ls:1;position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:calc(6px * var(--ls));box-sizing:border-box;color:var(--lg-ink);
  transition:transform 460ms cubic-bezier(.3,1.22,.5,1)}
.lens-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(3px * var(--ls));min-height:calc(52px * var(--ls));font-size:calc(11px * var(--ls));font-weight:600;-webkit-font-smoothing:antialiased}
.lens-tab svg{width:calc(22px * var(--ls));height:calc(22px * var(--ls));filter:drop-shadow(0 0 4px var(--lg-rim-a))}
.tab-pill-glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(85% 55% at 50% 0%,rgba(255,255,255,.30),transparent 62%),radial-gradient(70% 40% at 50% 105%,rgba(110,220,255,.16),transparent 70%);
  box-shadow:inset 0 0 10px rgba(255,255,255,.10),inset 3px 0 5px -2px rgba(255,80,160,.35),inset -3px 0 5px -2px rgba(70,225,255,.40)}
.tab-pill.instant{transition:none!important}.tab-pill.instant .lens-row{transition:margin 240ms cubic-bezier(.3,1.35,.5,1)!important}
.tabbar-in{touch-action:none}
.tab.on{cursor:grab}
.tabbar-in.grabbing,.tabbar-in.grabbing .tab{cursor:grabbing}
.tab-pill-glare{transition:transform 240ms cubic-bezier(.3,1.35,.5,1)}
.tab-pill-body{transition:transform 240ms cubic-bezier(.3,1.35,.5,1),box-shadow 240ms var(--ease)}
/* held: the bubble swells beyond the bar, like a drop of glass lifted by the finger */
.tab-pill.dragging .tab-pill-body,.tab-pill.dragging .tab-pill-glare{transform:scale(1.16,1.42)}
/* the window onto the bar grows with the glass, the text inside keeps its normal size */
.tab-pill-lens{transition:inset 240ms cubic-bezier(.3,1.35,.5,1)}
.lens-row{transition:transform 460ms cubic-bezier(.3,1.22,.5,1),margin 240ms cubic-bezier(.3,1.35,.5,1)}
.tab-pill.dragging .tab-pill-lens{inset:calc(-1 * var(--gy, 0px)) calc(-1 * var(--gx, 0px))}
.tab-pill.dragging .lens-row{margin-left:var(--gx, 0px);margin-top:var(--gy, 0px)}
.tab-pill.dragging .tab-pill-body{box-shadow:inset 0 1px 0 var(--lg-pill-hi),inset 1px 0 0 var(--lg-rim-a),inset -1px 0 0 var(--lg-rim-b),inset 0 -4px 10px rgba(70,200,255,.18),0 12px 28px rgba(0,0,0,.38),0 0 26px -4px var(--lg-rim-a)}
.tab.drag-over{color:var(--lg-ink)}
@keyframes liquid{0%{transform:scale(1)}35%{transform:scale(1.14,.9)}70%{transform:scale(.98,1.02)}100%{transform:scale(1)}}
@keyframes sheen{0%{left:-60%;opacity:0}25%{opacity:1}100%{left:115%;opacity:0}}

/* ===== NEXORA motion system: three speeds, one curve ===== */
:root{--d1:160ms;--d2:280ms;--d3:650ms;--ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.65,0,.35,1);
  --cyan:#46E3F5;--halo:rgba(70,200,255,.10);--sheen:rgba(160,210,255,.07);--scrim2:rgba(2,6,16,.55)}
:root[data-skin="noir"]{--cyan:#DDF6FA;--halo:rgba(255,255,255,.05);--sheen:rgba(255,255,255,.05)}
:root[data-skin="gris"]{--cyan:#BFF1F7;--halo:rgba(200,230,240,.07);--sheen:rgba(255,255,255,.06);--scrim2:rgba(12,14,18,.5)}
:root[data-skin="blanc"]{--cyan:#0AA3BE;--halo:rgba(40,150,230,.10);--sheen:rgba(255,255,255,.7);--scrim2:rgba(225,232,244,.55)}
body::before{content:"";position:fixed;left:50%;top:-28vh;width:130vw;height:72vh;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,var(--halo),transparent 70%);pointer-events:none;z-index:-1}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* cards & controls: subtle depth on hover, small press on touch */
.card{transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease),transform var(--d1) var(--ease)}
.btn,.chip,.pill,.seg button,.iconbtn,.avatar,.sb,.qa-item,.ck-i,.sendbtn,.rk,.day,.swatch{transition:transform var(--d1) var(--ease),filter var(--d1) var(--ease),background-color var(--d1) var(--ease),color var(--d1) var(--ease),border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
@media (hover:hover){
  button.card:hover,.srow.card:hover{border-color:var(--stroke-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px var(--shadow),0 0 24px -8px var(--glow)}
  .btn:hover:not([disabled]){filter:brightness(1.1)}
  .chip:hover,.pill:hover,.seg button:not(.on):hover,.day:hover{border-color:var(--stroke-hi);color:var(--text)}
  .rk:hover .rk-name{color:var(--accent-2)}
  .avatar:hover,.sendbtn:hover{box-shadow:0 0 18px var(--glow)}
}
button.card:active,.srow.card:active{transform:scale(.985)}
.btn:active:not([disabled]),.chip:active,.pill:active,.seg button:active,.iconbtn:active,.avatar:active,.sb:active,.sendbtn:active,.day:active{transform:scale(.96)}
.btn[disabled]{cursor:not-allowed}

/* page appear: fade + slight rise, groups staggered; only added on navigation */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0;transform:translateY(6px)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}}
@keyframes draw{to{stroke-dashoffset:0}}
.appear>*{animation:rise var(--d2) var(--ease) both}
.appear>*:nth-child(2){animation-delay:30ms}.appear>*:nth-child(3){animation-delay:60ms}.appear>*:nth-child(4){animation-delay:90ms}
.appear>*:nth-child(5){animation-delay:120ms}.appear>*:nth-child(6){animation-delay:150ms}.appear>*:nth-child(7){animation-delay:180ms}
.appear>*:nth-child(8){animation-delay:210ms}.appear>*:nth-child(9){animation-delay:240ms}.appear>*:nth-child(n+10){animation-delay:270ms}
/* charts: lines draw, bars grow, shapes settle — real data only, on appearance */
.appear .ln{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw var(--d3) var(--ease) .12s forwards}
.appear .chart polygon,.appear .chart circle{animation:fadeIn var(--d3) var(--ease) .2s both}
.appear .chart .radar-shape{transform-box:fill-box;transform-origin:center;animation:popIn var(--d3) var(--ease) .1s both}
.appear .rk-bar i,.appear .track .fill,.appear .semcmp .bars i,.appear .dvbar i{transform-origin:left center;animation:growX var(--d3) var(--ease) .12s both}
.appear .dvbar i[style*="right:"]{transform-origin:right center}
.appear [data-heat] rect{animation:fadeIn var(--d3) var(--ease) .15s both}
.num-changed{color:var(--cyan);text-shadow:0 0 14px var(--glow)}
[data-num]{transition:color var(--d3) var(--ease),text-shadow var(--d3) var(--ease)}

/* tab bar: cyan indicator on the active tab */
.tab{position:relative}

/* quick add */
.fab{transition:transform var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
.fab.open{transform:rotate(45deg)}
.fab:active{transform:scale(.94)}
.fab.open:active{transform:rotate(45deg) scale(.94)}
.fab-wrap:has(.fab.open){z-index:26}
.qa{position:fixed;inset:0;z-index:25}
.qa-scrim{position:absolute;inset:0;background:var(--scrim2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn var(--d2) var(--ease) both}
.qa-menu{position:absolute;right:max(16px,calc(50% - 227px));bottom:calc(160px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px}
.qa-item{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;animation:qaIn var(--d2) var(--ease) both;animation-delay:calc(var(--n) * 35ms)}
.qa-item .t b{display:block;font-weight:500;font-size:14.5px}
.qa-item .t small{display:block;color:var(--muted);font-size:12.5px}
@keyframes qaIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.qa.closing .qa-scrim,.qa.closing .qa-item{animation:fadeOut var(--d1) var(--ease) both}

/* command palette */
.cmdk{position:fixed;inset:0;z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:max(10vh,24px) 16px 16px}
.cmdk-scrim{position:absolute;inset:0;background:var(--scrim2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadeIn var(--d2) var(--ease) both}
.cmdk-box.card{position:relative;width:100%;max-width:560px;max-height:min(72vh,560px);display:flex;flex-direction:column;overflow:hidden;animation:modalIn var(--d2) var(--ease) both;background:linear-gradient(180deg,var(--sheen),transparent 42%),var(--glass),var(--bg)}
@keyframes modalIn{from{opacity:0;transform:translateY(-8px) scale(.97)}}
.cmdk.closing .cmdk-box,.cmdk.closing .cmdk-scrim{animation:fadeOut var(--d1) var(--ease) both}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--stroke);color:var(--muted)}
.cmdk-in input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:16px}
.cmdk-in input::placeholder{color:var(--dim)}
kbd{font:500 11px var(--f);padding:2px 6px;border-radius:6px;border:1px solid var(--stroke);color:var(--muted);background:var(--glass-flat);white-space:nowrap}
#cmdk-list{overflow:auto;padding:6px 6px 10px}
.ck-g{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:10px 10px 4px}
.ck-i{display:grid;grid-template-columns:32px minmax(0,1fr) 16px;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:12px;text-align:left;border:1px solid transparent}
.ck-i .t b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-i .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-i.on{background:var(--chip-on);border-color:var(--stroke-hi);box-shadow:inset 2px 0 0 var(--cyan)}
.ck-enter{color:var(--dim);opacity:0}
.ck-i.on .ck-enter{opacity:1}
.cmdk-foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--stroke);font-size:12px;color:var(--dim)}
.searchpill{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;color:var(--muted);font-size:14px;text-align:left}
.searchpill span{flex:1}
@media (hover:none){.cmdk-foot,.searchpill kbd{display:none}}

/* toasts */
.toast{display:flex;align-items:center;gap:10px;opacity:0;transform:translate(-50%,10px);transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--up);color:#04140C}
.toast-ic.err{background:var(--down);color:#FFFFFF}
.toast.err{border-color:var(--down);box-shadow:0 0 20px -4px var(--down)}

/* JARVIS orb: idle · listening · thinking · speaking · error */
.orb{position:relative;display:inline-grid;place-items:center;width:var(--s);height:var(--s);flex:none}
.orb>span{position:absolute;border-radius:50%}
.orb-halo{inset:-20%;background:radial-gradient(circle,var(--glow),transparent 65%);opacity:.55;transition:opacity var(--d2) var(--ease)}
.orb-ring{inset:0;border:1px solid var(--stroke-hi)}
.orb-ring.r2{inset:13%;border-color:var(--stroke)}
.orb-arc{inset:5%;border:2px solid transparent;border-top-color:var(--cyan);border-right-color:var(--cyan);opacity:0;transition:opacity var(--d2) var(--ease)}
.orb-core{inset:29%;background:radial-gradient(circle at 40% 35%,#FFFFFF 0,var(--cyan) 24%,var(--accent) 62%,transparent 74%);box-shadow:0 0 calc(var(--s) * .22) var(--glow);transition:transform var(--d2) var(--ease),filter var(--d2) var(--ease)}
.orb-wave{inset:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--s) * .035);opacity:0;transition:opacity var(--d2) var(--ease)}
.orb-wave i{display:block;width:calc(var(--s) * .035);height:calc(var(--s) * .24);border-radius:9px;background:#FFFFFF;transform:scaleY(.3)}
.orb[data-state="listening"] .orb-ring{animation:ripple 1.8s var(--ease) infinite}
.orb[data-state="listening"] .orb-ring.r2{animation-delay:.6s}
.orb[data-state="listening"] .orb-halo{opacity:.8}
@keyframes ripple{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.22);opacity:0}}
.orb[data-state="thinking"] .orb-arc{opacity:1;animation:spin 1.1s linear infinite}
.orb[data-state="thinking"] .orb-core{transform:scale(.86)}
@keyframes spin{to{transform:rotate(360deg)}}
.orb[data-state="speaking"] .orb-core{transform:scale(1.04)}
.orb[data-state="speaking"] .orb-wave{opacity:1}
.orb[data-state="speaking"] .orb-wave i{animation:wave .8s var(--ease-io) infinite alternate}
.orb-wave i:nth-child(2){animation-delay:.12s}.orb-wave i:nth-child(3){animation-delay:.24s}.orb-wave i:nth-child(4){animation-delay:.36s}.orb-wave i:nth-child(5){animation-delay:.48s}
@keyframes wave{to{transform:scaleY(1)}}
.orb[data-state="error"] .orb-core{background:radial-gradient(circle at 40% 35%,#FFFFFF 0,#FFB0A3 24%,var(--down) 62%,transparent 74%);filter:saturate(.75)}
.orb[data-state="error"] .orb-ring{border-color:var(--down);opacity:.6}
.orb[data-state="error"] .orb-halo{opacity:.15}
.orb[data-state="error"]{animation:shake .4s var(--ease) 1}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.orb-row{display:flex;align-items:center;gap:12px}
.avatar .orb{--s:24px}
/* particle sphere orb (canvas) */
.orb3d{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto;width:100%}
.orb3d canvas{width:min(var(--s),100%);aspect-ratio:1;height:auto;display:block;position:relative}
.orb3d::before{content:"";position:absolute;left:50%;top:calc(min(var(--s),100%) / 2);width:min(calc(var(--s) * .95),95%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--halo),transparent 68%);pointer-events:none}
.orb3d-label{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:color var(--d2) var(--ease)}
.orb3d[data-state="thinking"] .orb3d-label,.orb3d[data-state="speaking"] .orb3d-label,.orb3d[data-state="listening"] .orb3d-label{color:var(--cyan)}
.orb3d[data-state="error"] .orb3d-label{color:var(--down)}
.avatar canvas{display:block}
</style>

function notesOf(bid, p, extra = [], upto = null){
  return state.notes.concat(extra).filter(n => n.branchId === bid && (p === 'Y' || semOf(n.date) === p) && (!upto || n.date <= upto));
}
function wavg(ns){ if (!ns.length) return null; let a = 0, c = 0; for (const n of ns){ a += n.value * n.coef; c += n.coef; } return r1(a / c); }
function bAvg(bid, p, extra = [], upto = null){
  if (p === 'Y'){ const a = wavg(notesOf(bid,1,extra,upto)), b = wavg(notesOf(bid,2,extra,upto)); return a == null ? b : b == null ? a : r1((a + b) / 2); }
  return wavg(notesOf(bid, p, extra, upto));
}
const mean = arr => { const v = arr.filter(x => x != null); return v.length ? r1(v.reduce((s,x) => s + x, 0) / v.length) : null; };
const genAvg = (p, extra = [], mainOnly = false, upto = null) => mean(state.branches.filter(b => !mainOnly || b.main).map(b => bAvg(b.id, p, extra, upto)));
const periodNotes = p => state.notes.filter(n => p === 'Y' || semOf(n.date) === p);
const datesOf = ns => [...new Set(ns.map(n => n.date))].sort();
function trendLast(fnAt, dates){ if (dates.length < 2) return null; const a = fnAt(null), b = fnAt(dates[dates.length - 2]); return a == null || b == null ? null : r1(a - b); }
const mgTrend = p => trendLast(d => genAvg(p, [], false, d), datesOf(periodNotes(p)));
const bTrend = (bid, p) => trendLast(d => bAvg(bid, p, [], d), datesOf(notesOf(bid, p)));
function bTrendStart(bid, p){ const d = datesOf(notesOf(bid, p)); if (d.length < 2) return null; return r1(bAvg(bid, p) - bAvg(bid, p, [], d[0])); }
function trendHtml(d){

  if (d < 0) return `<span class="trend down">−${Math.abs(d).toFixed(1)}</span>`;
  return `<span class="trend flat">±0.0</span>`;
}
function neededNote(bid, target, coef, p){
  const sem = p === 'Y' ? curSem() : p;
  let tg = target;
  if (p === 'Y' && sem === 2){ const a1 = bAvg(bid, 1); if (a1 != null) tg = Math.ceil((2 * target - 0.1 - a1) * 10 - 1e-7) / 10; }
  let a = 0, c = 0; for (const n of notesOf(bid, sem)){ a += n.value * n.coef; c += n.coef; }
  return Math.ceil((((tg - 0.05) * (c + coef) - a) / coef) * 10 - 1e-7) / 10;
}
function mgFrom(list, p){

    if (p === 'Y'){ const a = f(1), c = f(2); return a == null ? c : c == null ? a : r1((a + c) / 2); }
    return f(p);
  }));
}

/* ================= inbox: an alert 7 days before and the day before each event ================= */
function alerts(){
  const td = today(), min = addDays(td, -60), out = [];
  for (const e of state.events){
    for (const [k, days] of [['w', 7], ['d', 1]]){
      const ad = addDays(e.date, -days);
      if (ad > td || ad < min) continue;
      if (e.createdAt && e.createdAt > ad) continue;
      if (k === 'd' && e.kind === 'devoir' && e.done) continue;
      const id = e.id + ':' + e.date + ':' + k;
      if (state.inbox.hidden[id]) continue;
      out.push({id, e, k, date: ad, read: !!state.inbox.read[id]});
    }
  }
  return out.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.k === 'd' ? -1 : 1));
}
const unreadCount = () => alerts().filter(a => !a.read).length;

/* ================= saving ================= */
let docRef = null, sync = 'loading', remoteSeen = false, writing = false, dirty = false, timer = null;
function commit(){
  state.updatedAt = Date.now(); saveLocal(); renderAll();
  dirty = true; clearTimeout(timer);
  if (docRef && remoteSeen){ sync = 'saving'; timer = setTimeout(flush, 500); }
}
async function flush(){
  clearTimeout(timer);
  if (writing || !docRef || !remoteSeen || !dirty) return;
  writing = true; dirty = false;
  try { await docRef.set({state: JSON.parse(JSON.stringify(state))}); sync = 'saved'; try { localStorage.setItem(LS_SYNC, '1'); } catch(e){} }
  catch(e){ dirty = true; if (sync !== 'error' && sync !== 'quota') toast(t("Enregistrement dans ton compte impossible pour l'instant. Tes données restent sur cet appareil et seront renvoyées automatiquement."), 'err'); sync = e && e.code === 'quota_exceeded' ? 'quota' : 'error';
    if (!e || !['invalid_argument','quota_exceeded','revoked'].includes(e.code)) timer = setTimeout(flush, 4000 + Math.random() * 2000); }
  writing = false;
  if (dirty && sync === 'saved') flush();
  renderSyncSpots();
}
async function initSync(){
  try {
    if (!window.claude || !window.claude.use){ sync = 'local'; renderSyncSpots(); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id){ sync = 'local'; renderSyncSpots(); return; }
    docRef = db.doc('data/users/' + id + '/carnet');
    docRef.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      let never = true; try { never = localStorage.getItem(LS_SYNC) !== '1'; } catch(e){}
      const remote = snap.exists ? normalize((snap.data() || {}).state) : null;
      const first = !remoteSeen; remoteSeen = true;
      if (remote && (remote.updatedAt > state.updatedAt || (first && never))){
        state = remote; saveLocal(); dirty = false; sync = 'saved';
        try { localStorage.setItem(LS_SYNC, '1'); } catch(e){}
        if (first) view = curSem();
        renderAll();
      } else if (!remote || remote.updatedAt < state.updatedAt){ dirty = true; flush(); }
      else sync = 'saved';
      renderSyncSpots();
    }, () => { sync = 'error'; renderSyncSpots(); });
  } catch(e){ sync = 'local'; renderSyncSpots(); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
const syncText = () => ({loading:['busy',t('Connexion…')], saving:['busy',t('Enregistrement…')], saved:['ok',t('Enregistré')], local:['',t('Enregistré sur cet appareil')], error:['err',t('Hors ligne : gardé sur cet appareil')], quota:['err',t('Espace plein : gardé sur cet appareil')]})[sync];
const syncHtml = () => { const [c,s] = syncText(); return `<span class="sync" data-sync><span class="dot ${c}"></span>${s}</span>`; };

const shortDate = s => dmy(s).slice(0, 5);
function areaChart(vals, {h = 150, yMin = null, yMax = 6, axis = true, labels = [], id = 'ag'} = {}){
  if (!vals.length) return '';
  const W = 320, H = h, L = axis ? 28 : 0, R = axis ? 10 : 0, T = axis ? 10 : 6, B = axis ? 22 : 0;
  if (yMin == null) yMin = Math.max(1, Math.floor(Math.min(...vals)) - 1);
  if (yMax - yMin < 1) yMin = yMax - 1;
  const n = vals.length;
  const sx = i => n === 1 ? (L + W - R) / 2 : L + i / (n - 1) * (W - L - R);
  const sy = v => T + (yMax - v) / (yMax - yMin) * (H - T - B);
  let g = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>`;
  if (axis) for (let y = yMin; y <= yMax + 1e-9; y += 1)
    g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}"/><text class="tx" x="${L-6}" y="${sy(y)+3.5}" text-anchor="end">${y.toFixed(1)}</text>`;
  const pts = vals.map((v, i) => [sx(i), sy(v)]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  if (n > 1) g += `<polygon points="${pts[0][0]},${H-B} ${line} ${pts[n-1][0]},${H-B}" fill="url(#${id})"/><polyline points="${line}" pathLength="1" class="ln" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--accent-2);filter:drop-shadow(0 0 4px var(--glow))"/>`;
  pts.forEach((p, i) => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === n - 1 ? 4 : 2.2}" style="fill:${i === n - 1 ? 'var(--point)' : 'var(--accent-2)'}${i === n - 1 ? ';filter:drop-shadow(0 0 5px var(--accent-2))' : ''}"/>`; });
  if (axis && labels.length){ const step = Math.ceil(n / 6); labels.forEach((l, i) => { if (i === n - 1 || (i % step === 0 && n - 1 - i >= step)) g += `<text class="tx" x="${sx(i)}" y="${H-6}" text-anchor="${n > 1 && i === n - 1 ? 'end' : n > 1 && i === 0 ? 'start' : 'middle'}">${esc(l)}</text>`; }); }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="${axis ? 'xMidYMid meet' : 'none'}" role="img" aria-label="${t('Évolution')}">${g}</svg>`;
}
function lineChart(series, {yMin = 1, yMax = 6, yStep = 1, ref = null, h = 210} = {}){
  const pts = series.flatMap(s => s.points);
  if (!pts.length) return `<p class="empty">${t('Pas encore de données pour ce graphique.')}</p>`;
  const W = 330, H = h, L = 24, R = 10, T = 10, B = 22;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  if (x1 - x0 < DAY * 8){ const m = (x0 + x1) / 2; x0 = m - DAY * 5; x1 = m + DAY * 5; }
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (yMax - y) / (yMax - yMin) * (H - T - B);
  let g = '';
  for (let y = yMin; y <= yMax + 1e-9; y += yStep) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}"/><text class="tx" x="${L-6}" y="${sy(y)+3.5}" text-anchor="end">${y}</text>`;
  if (ref != null) g += `<line class="ref" x1="${L}" x2="${W-R}" y1="${sy(ref)}" y2="${sy(ref)}"/>`;
  const d0 = new Date(x0); let m = new Date(d0.getFullYear(), d0.getMonth() + 1, 1).getTime(); const ticks = [];
  while (m <= x1){ ticks.push(m); const d = new Date(m); m = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(); }
  const st = Math.ceil(ticks.length / 6) || 1;
  ticks.filter((_, i) => i % st === 0).forEach(tk => g += `<text class="tx" x="${sx(tk)}" y="${H-6}" text-anchor="middle">${cal().m[new Date(tk).getMonth()]}</text>`);
  for (const s of series){
    if (s.points.length > 1) g += `<polyline points="${s.points.map(p => sx(p.x).toFixed(1) + ',' + sy(p.y).toFixed(1)).join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="${s.w || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : 'pathLength="1" class="ln"'}/>`;
    for (const p of s.points) g += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" style="fill:${s.color}"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Évolution')}">${g}</svg>`;
}

const GREET = {
  fr: {m:'Bonjour{c}', a:'Bon après-midi{c}', e:'Bonsoir{c}', back:'Bon retour{c}'},
  en: {m:'Good morning{c}', a:'Good afternoon{c}', e:'Good evening{c}', back:'Welcome back{c}'},
  de: {m:'Guten Morgen{c}', a:'Guten Tag{c}', e:'Guten Abend{c}', back:'Willkommen zurück{c}'}

let greetSeed = Math.random(), hiddenAt = 0;
function greeting(){
  const G = GREET[lang()] || GREET.fr, h = new Date().getHours();
  const slot = h >= 5 && h < 12 ? 'm' : h >= 12 && h < 18 ? 'a' : 'e';
  const s = greetSeed < 0.5 ? G[slot] : G.back;
  const parts = s.split('{c}');
  return parts.map(esc).join(firstName() ? ', ' + esc(firstName()) : '');

let calMonth = today().slice(0, 7), calSel = today();
SCREENS.cal = () => {
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), startDow = (first.getDay() + 6) % 7, start = new Date(y, m - 1, 1 - startDow);
  let cells = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i); const s = iso(d);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    const evs = state.events.filter(e => e.date === s);
    cells += `<button class="day ${d.getMonth() !== m - 1 ? 'out' : ''} ${s === today() ? 'today' : ''} ${s === calSel ? 'sel' : ''}" data-act="cal-day" data-d="${s}"><span class="num">${d.getDate()}</span><span class="dots">${evs.slice(0, 3).map(e => `<i style="background:${evColor(e)}"></i>`).join('')}</span></button>`;
  }
  const dayEvs = state.events.filter(e => e.date === calSel);
  const upcoming = state.events.filter(e => e.date > calSel && !(e.kind === 'devoir' && e.done)).sort((a,b) => a.date < b.date ? -1 : 1).slice(0, 6);
  const dot = c => `<i class="mp-dot" style="background:${c};box-shadow:none;margin:0 4px 0 0"></i>`;
  return `<div class="top"><h1 class="h1">${t('Calendrier')}</h1><button class="btn primary sm" data-act="new-event" style="padding:0 16px">${ui('plus', 18, 2)}${t('Ajouter')}</button></div>
    <div class="card pad">
      <div class="cal-hd"><button class="iconbtn" data-act="cal-month" data-v="-1" aria-label="${t('Mois précédent')}">${ui('chevL', 18, 2)}</button><b>${cal().ml[m - 1]} ${y}</b><button class="iconbtn" data-act="cal-month" data-v="1" aria-label="${t('Mois suivant')}">${ui('chev', 18, 2)}</button></div>
      <div class="cal">${cal().w.map(d => `<span class="wd">${d}</span>`).join('')}${cells}</div>
    </div>
    <div class="pills"><span class="pill">${dot('#5AA2FF')}${t('Évaluation')}</span><span class="pill">${dot('#FFB547')}${t('Devoir')}</span><span class="pill">${dot('#B48CFF')}${t('Autre')}</span></div>
    <h2 class="h2">${calSel === today() ? t("Aujourd'hui") : dayName(calSel)}</h2>
    ${dayEvs.length ? `<div>${dayEvs.map(evRow).join('')}</div>` : `<button class="card pad hint" data-act="new-event" style="text-align:center">${t('Rien ce jour-là. Touche pour ajouter un événement.')}</button>`}
    <h2 class="h2">${t('À venir')}</h2>
    ${upcoming.length ? `<div>${upcoming.map(evRow).join('')}</div>` : `<p class="hint">${t('Rien de prévu après ce jour.')}</p>`}${timelineHtml()}`;
};

let goalsTab = 'goals', goalCoef = 1;
const sim = {items: [], branchId: null, value: '', coef: 1, err: '', q: {branchId: null, target: '', coef: 1}};
function goalCard(g){
  const finished = g.period === 1 && curSem() === 2;
  const lines = g.kind === 'branch' ? g.branchIds.filter(getB).map(id => ({id, name: getB(id).name, v: bAvg(id, g.period)}))
    : [{name: g.kind === 'mg' ? t('Moyenne générale') : t('Moyenne des principales'), v: genAvg(g.period, [], g.kind === 'mp')}];
  const ok = lines.length && lines.every(l => l.v != null && l.v >= g.target);
  const pct = v => Math.max(0, Math.min(100, (v - 1) / 5 * 100));
  const what = g.kind === 'mg' ? t('Moyenne générale') : g.kind === 'mp' ? t('Moyenne des principales') : g.branchIds.map(id => getB(id)?.name).filter(Boolean).join(t(' et '));
  return `<div class="card goal ${ok ? 'ok' : ''}">
    <div class="goal-hd"><div><b>${esc(what)} ≥ ${g.target.toFixed(1)}</b><small>${goalEnd(g.period)}${finished ? ' · ' + t('semestre terminé') : ''}</small></div><span class="badge ${ok ? 'ok' : ''}">${ok ? t('Atteint') : t('En cours')}</span></div>
    ${lines.map(l => {
      let need = '';
      if (l.v == null) need = t('Pas encore de note.');
      else if (l.id && !finished){
        const ne = nextEval(l.id, g.period), coef = ne ? (ne.coef || 1) : goalCoef, n = neededNote(l.id, g.target, coef, g.period);
        const when = ne ? t('Prochain test le {d} ({c})', {d: dmy(ne.date), c: coefTxt(coef)}) : t('Prochain test ({c})', {c: coefTxt(coef)});
        need = n <= 1 ? t('{w} : déjà assuré.', {w: when}) : n > 6 ? t('{w} : pas atteignable en un seul test (il faudrait {n}).', {w: when, n: fn(n)}) : t('{w} : au moins <b>{n}</b>.', {w: when, n: fn(n)});
      } else if (!l.id) need = l.v >= g.target ? t('Marge : +{d}', {d: (l.v - g.target).toFixed(1)}) : t('Il manque {d} point.', {d: (g.target - l.v).toFixed(1)});
      return `<div class="gline"><span>${esc(l.name)}</span><b class="num ${gcls(l.v)}" style="font-weight:500">${f1(l.v)}</b>
        <div class="track"><div class="fill" style="width:${l.v == null ? 0 : pct(l.v)}%"></div><div class="tgt" style="left:calc(${pct(g.target)}% - 1px)"></div></div>${need ? `<span class="need">${need}</span>` : ''}</div>`;
    }).join('')}
    <button class="linkbtn" data-act="del-goal" data-id="${g.id}">${t('Supprimer cet objectif')}</button></div>`;
}
SCREENS.goals = () => {
  let body;
  if (goalsTab === 'focus') body = focusHtml();
  else if (goalsTab === 'goals'){
    body = `${state.goals.length ? state.goals.map(goalCard).join('') : `<p class="empty">${t("Aucun objectif pour l'instant.")}</p>`}
      <button class="btn primary" data-act="new-goal">${ui('plus', 18, 2)}${t('Nouvel objectif')}</button>
      <span class="lab">${t("Coef utilisé s'il n'y a pas de test prévu dans le calendrier")}</span>${stepperHtml('goal-coef', goalCoef)}`;
  } else {
    const p = curSem();
    sim.branchId = getB(sim.branchId) ? sim.branchId : state.branches[0]?.id; sim.q.branchId = getB(sim.q.branchId) ? sim.q.branchId : sim.branchId;
    const extra = sim.items.map(i => ({...i, date: today()}));
    const delta = (a, b) => { if (a == null || b == null) return ''; const d = r1(b - a); return d > 0 ? `<span class="up">+${d.toFixed(1)}</span>` : d < 0 ? `<span class="down">${d.toFixed(1)}</span>` : '='; };
    const row = (l, a, b) => `<tr><td>${l}</td><td>${f1(a)}</td><td>→ <b class="${gcls(b)}">${f1(b)}</b></td><td>${delta(a, b)}</td></tr>`;
    const affected = [...new Set(sim.items.map(i => i.branchId))].filter(getB);
    let qRes = '';
    const qt = parseNum(sim.q.target);
    if (qt != null && qt >= 1 && qt <= 6 && getB(sim.q.branchId)){
      const n = neededNote(sim.q.branchId, qt, sim.q.coef, p);
      qRes = `<div class="card pad stack" style="align-items:center;text-align:center"><span class="hint">${t('Pour avoir {v} en {b} ce semestre', {v: qt.toFixed(1), b: esc(getB(sim.q.branchId).name)})}</span>
        ${n > 6 ? `<span class="answer down">&gt; 6</span><span class="hint">${t('Pas possible avec un seul test ({c}). Il faudrait {n}.', {c: coefTxt(sim.q.coef), n: fn(n)})}</span>` : n <= 1 ? `<span class="answer up">${t('Assuré')}</span><span class="hint">${t('Même avec un 1, tu y es.')}</span>` : `<span class="answer num">${fn(n)}</span><span class="hint">${t('au minimum au prochain test ({c})', {c: coefTxt(sim.q.coef)})}</span>`}</div>`;
    }
    body = `<p class="hint">${t("Essaie des notes imaginaires. Rien n'est ajouté à tes vraies notes. Calculé pour : {p}.", {p: periodLabel(p)})}</p>
      <h2 class="h2">${t("Et si j'avais…")}</h2>
      <select class="field" data-in="sim-branch" aria-label="${t('Matière')}">${opts(sim.branchId)}</select>
      <div class="card stepper"><span></span><div class="sv"><input data-in="sim-value" inputmode="decimal" placeholder="–" value="${esc(sim.value)}" aria-label="${t('Note')}"><span class="unit">/ 6</span></div><span></span></div>
      <span class="lab">${t('Coefficient')}</span>${stepperHtml('sim-coef', sim.coef)}
      ${sim.err ? `<p class="err">${esc(sim.err)}</p>` : ''}
      <button class="btn primary" data-act="sim-add">${ui('plus', 18, 2)}${t('Ajouter au simulateur')}</button>
      ${sim.items.length ? `<div class="chips">${sim.items.map((i, k) => `<button class="chip" data-act="sim-rm" data-v="${k}">${esc(getB(i.branchId)?.abbr || '?')} ${fn(i.value)} · ${coefTxt(i.coef)} ✕</button>`).join('')}</div>
        <div class="card pad"><table class="cmp"><tbody>${row(`<b style="font-weight:500">${t('Moyenne générale')}</b>`, genAvg(p), genAvg(p, extra))}${row(t('Principales'), genAvg(p, [], true), genAvg(p, extra, true))}
        ${affected.map(id => row(esc(getB(id).name), bAvg(id, p), bAvg(id, p, extra))).join('')}</tbody></table></div>
        <button class="btn ghost sm" data-act="sim-clear" style="align-self:center">${t('Tout effacer')}</button>` : ''}
      <h2 class="h2">${t('Quelle note me faut-il ?')}</h2>
      <select class="field" data-in="q-branch" aria-label="${t('Matière')}">${opts(sim.q.branchId)}</select>
      <span class="lab">${t('Moyenne voulue')}</span>
      <div class="card stepper"><span></span><div class="sv"><input data-in="q-target" inputmode="decimal" placeholder="4.5" value="${esc(sim.q.target)}" aria-label="${t('Moyenne voulue')}"><span class="unit">/ 6</span></div><span></span></div>
      <span class="lab">${t('Coefficient du test')}</span>${stepperHtml('q-coef', sim.q.coef)}
      ${qRes}`;
  }
  return `<h1 class="h1">${t('Objectifs')}</h1>${seg('goals-tab', [['goals',t('Objectifs')],['sim',t('Simulateur')],['focus',t('Focus')]], goalsTab)}${body}`;
};

/* text inputs: update the page state without re-rendering (keeps focus) */
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  const v = e.target.value, pg = cur();
  if (k === 'note-value'){ pg.f.value = v; const el = document.querySelector('[data-preview]'); if (el) el.innerHTML = notePreview(pg); }
  else if (k === 'note-comment') pg.f.comment = v;
  else if (k === 'ev-title') pg.f.title = v;
  else if (k === 'ev-details') pg.f.details = v;
  else if (k === 'b-name'){ pg.f.name = v; if (!pg.abbrTouched){ pg.f.abbr = v.normalize('NFD').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase(); const a = document.querySelector('[data-in="b-abbr"]'); if (a) a.value = pg.f.abbr; } }
  else if (k === 'b-abbr'){ pg.f.abbr = v.toUpperCase(); pg.abbrTouched = true; }
  else if (k === 'b-np'){ pg.f.np = +v; const s = document.querySelector('[data-npv]'); if (s) s.textContent = v; }
  else if (k === 'pref'){ pg.vals[e.target.dataset.id] = +v; const s = document.querySelector(`[data-pv="${e.target.dataset.id}"]`); if (s) s.textContent = v; }
  else if (k === 'g-target') pg.f.target = v;
  else if (k === 'sim-value') sim.value = v;
  else if (k === 'q-target') sim.q.target = v;
  else if (k === 'info') pg.f[e.target.dataset.k] = v;
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  const v = e.target.value, pg = cur();
  if (k === 'note-date'){ pg.f.date = v || today(); renderAll(); }
  else if (k === 'ev-date'){ pg.f.date = v || today(); }
  else if (k === 'sim-branch') sim.branchId = v;
  else if (k === 'q-branch'){ sim.q.branchId = v; renderAll(); }
  else if (k === 'q-target'){ renderAll(); }
  else if (k === 's2'){ state.s2Start = v || null; view = curSem(); commit(); toast(state.s2Start ? t('2e semestre dès le {d}', {d: dmy(state.s2Start)}) : t('Date retirée')); }
  else if (k === 'bk-file' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => { try { const s = normalize(JSON.parse(r.result)); if (!s) throw 0; bk.imp = s; bk.impErr = ''; } catch(_){ bk.imp = null; bk.impErr = t("Ce fichier n'est pas une copie de NEXORA."); } renderAll(); };

});

function md(s){
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let out = '', inList = false;
  for (const l of lines){
    const m = /^\s*(?:[-•*]|\d+\.)\s+(.*)$/.exec(l);
    if (m){ if (!inList){ out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; }
    else { if (inList){ out += '</ul>'; inList = false; } out += l.trim() ? l + '<br>' : '<br>'; }

}

/* averages for any set of notes (used for archived years) */
function avgEngine(notes, s2, branches){
  const so = d => (s2 && d >= s2) ? 2 : 1;
  const w = ns => { if (!ns.length) return null; let a = 0, c = 0; ns.forEach(n => { a += n.value * n.coef; c += n.coef; }); return r1(a / c); };
  const b = (bid, p, upto) => { const f = s => w(notes.filter(n => n.branchId === bid && so(n.date) === s && (!upto || n.date <= upto))); if (p === 'Y'){ const x = f(1), y = f(2); return x == null ? y : y == null ? x : r1((x + y) / 2); } return f(p); };
  const mg = (p, upto, mainOnly) => mean(branches.filter(x => !mainOnly || x.main).map(x => b(x.id, p, upto)));
  return {b, mg, semOf: so};
}
function findSubject(q){
  const nz = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  const x = nz(q); if (!x) return null;
  const B = state.branches;
  let r = B.find(b => nz(b.abbr) === x) || B.find(b => nz(b.name) === x) || B.find(b => nz(b.name).startsWith(x)) || B.find(b => nz(b.name).includes(x));
  if (r) return r;
  const row = DEFAULTS.find(d => [d[0], d[2], d[4], d[1], d[3], d[5]].some(v => nz(v) === x || nz(v).startsWith(x)));
  if (row){ r = B.find(b => [row[0], row[2], row[4]].includes(b.name)); if (r) return r; }
  if (x.length >= 4) r = B.find(b => nz(b.name).startsWith(x.slice(0, 4)));
  return r || null;
}

function xyChart(series, {yMin = 1, yMax = 6, ref = 4, h = 200} = {}){

  const W = 330, H = h, L = 24, R = 10, T = 10, B = 22;
  const xMax = Math.max(14, ...pts.map(p => p.x));

  if (ref != null) g += `<line class="ref" x1="${L}" x2="${W-R}" y1="${sy(ref)}" y2="${sy(ref)}"/>`;
  const step = xMax > 70 ? 28 : 14;
  for (let x = step; x <= xMax; x += step) g += `<text class="tx" x="${sx(x)}" y="${H-6}" text-anchor="middle">${t('{n} sem.', {n: x / 7})}</text>`;
  for (const s of series){
    if (s.points.length > 1) g += `<polyline points="${s.points.map(p => sx(p.x).toFixed(1) + ',' + sy(p.y).toFixed(1)).join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="${s.w || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : 'pathLength="1" class="ln"'}/>`;
    for (const p of s.points) g += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" style="fill:${s.color}"/>`;
  }

}

/* ---------- weekly review ---------- */
const wk = {ws: null, busy: false, ctl: null, err: '', streaming: ''};
function weekStats(ws){
  const we = addDays(ws, 6), before = addDays(ws, -1), p = semOf(we);
  const notes = state.notes.filter(n => n.date >= ws && n.date <= we).sort((a, b) => a.date < b.date ? -1 : 1);
  const mgA = genAvg(p, [], false, before), mgB = genAvg(p, [], false, we);
  const subs = state.branches.filter(b => notes.some(n => n.branchId === b.id)).map(b => ({b, a: bAvg(b.id, p, [], before), c: bAvg(b.id, p, [], we)})).map(x => ({...x, d: x.a == null ? null : r1(x.c - x.a)}));
  const focus = state.focus.filter(f => f.date >= ws && f.date <= we).reduce((s, f) => s + f.minutes, 0);
  const next = state.events.filter(e => e.date > we && e.date <= addDays(we, 7)).sort((a, b) => a.date < b.date ? -1 : 1);
  return {ws, we, p, notes, mgA, mgB, mgDelta: mgA != null && mgB != null ? r1(mgB - mgA) : null, subs, focus, next};
}

async function weekAi(){
  if (wk.busy) return;
  const s = await getSample();
  if (!s){ wk.err = t("L'assistant n'est pas encore branché dans cette version de l'app. Il arrive bientôt !"); renderAll(); return; }
  const st = weekStats(wk.ws), ws = wk.ws;
  const data = {week: `${st.ws} to ${st.we}`, semester: st.p, overall_before: st.mgA, overall_after: st.mgB,
    grades: st.notes.map(n => ({subject: getB(n.branchId)?.name, grade: n.value, weight: n.coef, type: n.type, date: n.date})),
    subjects: st.subs.map(x => ({subject: x.b.name, before: x.a, after: x.c})), focus_minutes: st.focus,
    next_week: st.next.map(e => ({kind: e.kind, title: e.title, subject: getB(e.branchId)?.name || null, date: e.date})), first_name: state.profile.first || null};
  const prompt = `You write the weekly review in the school grades app "NEXORA" (Geneva, Switzerland). Answer in ${langLabel()}. Write 4 to 6 short sentences, warm and encouraging but honest, plain text without headings or lists. Mention the overall average trend, notable grades, subjects improving, subjects to watch and what is coming next week. If there were no grades this week, say so kindly and focus on what comes next. Grades go from 1 to 6, 6 is best, 4 is the pass mark.\n\nWEEK DATA:\n${JSON.stringify(data)}`;
  wk.busy = true; wk.err = ''; wk.streaming = ''; renderAll();
  wk.ctl = new AbortController();
  try {
    const res = await s(prompt, {signal: wk.ctl.signal, cache: false, onText: ({text}) => { wk.streaming = text; const el = document.getElementById('ai-week'); if (el) el.innerHTML = md(text); }});
    state.reports[ws] = {text: res.text, at: today()};
    const keys = Object.keys(state.reports).sort(); while (keys.length > 20) delete state.reports[keys.shift()];
    wk.busy = false; commit();
  } catch(e){ wk.busy = false; if (!e || e.code !== 'cancelled') wk.err = aiErr(e && e.code); renderAll(); }
}

  const h2 = s => { need(14); y += 4; doc.setFont('helvetica', 'bold'); doc.setFontSize(12); col(NAVY); txt(s, 14, y); y += 6; doc.setFont('helvetica', 'normal'); };

  boxes.forEach(([l, v], i) => { const x = 14 + i * 46; fill(LIGHT); doc.roundedRect(x, y, 42, 22, 2, 2, 'F'); col(GREY); doc.setFontSize(8); txt(l, x + 4, y + 7); col(NAVY); doc.setFontSize(15); txt(v, x + 4, y + 17); });

async function downloadReport(){
  if (rep.busy) return;
  rep.busy = true; rep.msg = ''; renderAll();
  try {
    const dl = window.claude && claude.use ? await claude.use('downloads') : null;
    if (!dl){ rep.msg = t("Le téléchargement n'est pas possible ici. Ouvre l'app dans Claude pour télécharger le PDF."); }
    else {
      const doc = await buildPdf(rep.p);
      const name = `rapport-${rep.p === 'Y' ? 'annee' : rep.p === 1 ? '1er-semestre' : '2e-semestre'}-${today()}.pdf`;
      await dl.save({filename: name, data: doc.output('blob')});
      rep.msg = t('PDF téléchargé.');
    }
  } catch(e){ rep.msg = e && e.code === 'declined' ? t('Téléchargement annulé.') : t("Le PDF n'a pas pu être créé. Réessaie."); }
  rep.busy = false; renderAll();
}

});

/* numbers: count up from the previous value only when that same value really changed */
const lastNums = {}, lastRings = {};
function animateNums(){
  document.querySelectorAll('[data-num]').forEach(el => {
    const k = el.dataset.num, v = el.dataset.v === '' ? null : +el.dataset.v, prev = lastNums[k];
    lastNums[k] = v;
    if (prev == null || v == null || prev === v || RM()) return;
    const t0 = performance.now();
    el.classList.add('num-changed'); el.textContent = prev.toFixed(1);
    const step = now => { const p = Math.min(1, (now - t0) / MOTION.chart); el.textContent = (prev + (v - prev) * easeOut(p)).toFixed(1); if (p < 1) requestAnimationFrame(step); else { el.textContent = v.toFixed(1); setTimeout(() => el.classList.remove('num-changed'), 500); } };
    requestAnimationFrame(step);
  });
}
function animateRings(appear){
  document.querySelectorAll('[data-ring]').forEach(el => {
    const k = el.dataset.ring, fr = +el.dataset.frac, C = +el.dataset.c, prev = lastRings[k];
    lastRings[k] = fr;
    if (RM() || !el.animate) return;
    const from = prev != null && prev !== fr ? prev : (prev == null && appear ? 0 : null);
    if (from == null) return;
    el.animate([{strokeDasharray: `${(C * from).toFixed(1)} ${C}`}, {strokeDasharray: `${(C * fr).toFixed(1)} ${C}`}], {duration: MOTION.chart, easing: 'cubic-bezier(.22,1,.36,1)'});
  });
}

/* ================= v7: particle sphere orb, always alive in the Assistant ================= */
/* lattice points: [x, y, z, rnd, n1 (how far it flies), n2 (size), stray (floats around the sphere), jx, jy, jz (drift direction)] */
const ORB_PTS = (() => { const N = 3600, pts = [], ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++){ const y = 1 - (i + .5) / N * 2, r = Math.sqrt(1 - y * y), th = ga * i;
    let jx = Math.random() * 2 - 1, jy = Math.random() * 2 - 1, jz = Math.random() * 2 - 1; const l = Math.hypot(jx, jy, jz) || 1;
    pts.push([Math.cos(th) * r, y, Math.sin(th) * r, Math.random(), Math.random(), Math.random(), Math.random() < .06, jx / l, jy / l, jz / l]); }
  return pts; })();
/* per state: seconds per dissolve → cloud → reform cycle, how far the points fly, rotation speed */
const ORB_P = {idle: {T: 7, k: 1, sp: .15}, listening: {T: 6, k: .45, sp: .2}, thinking: {T: 3.2, k: 1, sp: .45}, speaking: {T: 4.5, k: .8, sp: .25}, error: {T: 14, k: 0, sp: .05}};
const orbAnim = {a: .6, t: 0, ph: 0, cyc: 0, raf: 0, last: 0, T: 7, k: 1, sp: .15, col: [255, 255, 255], tcol: [255, 255, 255], st: '', colAt: 0};
const smooth01 = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
function orbColors(st){
  const cs = getComputedStyle(document.documentElement);
  const hex = v => { v = String(v).trim(); if (v[0] !== '#') return null; if (v.length === 4) v = '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3]; return [1, 3, 5].map(i => parseInt(v.slice(i, i + 2), 16)); };
  const base = state.settings.skin === 'blanc' ? [20, 40, 90] : [255, 255, 255];
  if (st === 'error') return hex(cs.getPropertyValue('--down')) || [255, 93, 93];
  if (st === 'thinking') return hex(cs.getPropertyValue('--cyan')) || base;
  if (st === 'speaking'){ const c = hex(cs.getPropertyValue('--accent-2')) || base; return base.map((b, i) => Math.round(b * .45 + c[i] * .55)); }
  return base;
}
/* One cycle (ph 0 → 1): intact lattice → a wave sweeps across and the dots tear away → loose cloud → dots fly back and the sphere reforms.
   Only the front half of the intact sphere is drawn; detached dots become a see-through cloud. */
function drawOrb(cv, a, ph, tm, kMax, cyc, col, dpr){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * .32;
  ctx.clearRect(0, 0, W, H);
  const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(.35), sb = Math.sin(.35), small = W < 120 * dpr, step = small ? 6 : 1;
  const base = (small ? 1.2 : 1.6) * dpr;
  /* the wave comes from a different side each cycle */
  const th = -0.8 + cyc * 2.3, dx = Math.cos(th), dy = Math.sin(th);
  /* no holds: the wave sweeps across (first 42 % of the cycle), then the dots fly straight back (the rest) */
  const front = ph < .42 ? 1.35 - ph / .42 * 2.9 : -9;
  const back = ph < .42 ? 0 : (ph - .42) / .58;
  ctx.fillStyle = `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`;
  for (let i = 0; i < ORB_PTS.length; i += step){
    const [x, y, z, rnd, n1, n2, stray, jx, jy, jz] = ORB_PTS[i];
    /* where this dot is on screen before moving decides when the wave reaches it */
    const xr = x * ca + z * sa, zr = -x * sa + z * ca, yr = y * cb - zr * sb;
    let k = ph < .42 ? smooth01((xr * dx + yr * dy - front) / .45) : smooth01(1 - (back - rnd * .4) / .6);
    k *= kMax;
    const wob = Math.sin(tm * .9 + rnd * 40), drift = .17 * (.6 + .4 * Math.sin(tm * .7 + n2 * 30));
    const rad = 1 + k * (.06 + .27 * n1 + .05 * wob);
    const px = x * rad + jx * k * drift, py = y * rad + jy * k * drift, pz = z * rad + jz * k * drift;
    const x1 = px * ca + pz * sa, z1 = -px * sa + pz * ca, y1 = py * cb - z1 * sb, z2 = py * sb + z1 * cb;
    const al = z2 >= 0 ? .92 : k * .7;
    if (al < .04) continue;
    const sz = base * (1 + k * (n2 > .6 ? .8 : .2));
    ctx.globalAlpha = al;
    ctx.fillRect(cx + x1 * R - sz / 2, cy + y1 * R - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
}
function orbLoop(now){
  const cv = document.querySelector('canvas[data-orb3d]');
  if (!cv || RM()){ orbAnim.raf = 0; return; }
  const wrap = cv.parentElement, st = wrap.dataset.state || 'idle', P = ORB_P[st] || ORB_P.idle;
  const dt = orbAnim.last ? Math.min(.05, (now - orbAnim.last) / 1000) : 0; orbAnim.last = now;
  orbAnim.sp += (P.sp - orbAnim.sp) * .05; orbAnim.k += (P.k - orbAnim.k) * .04; orbAnim.T += (P.T - orbAnim.T) * .05;
  orbAnim.ph += dt / orbAnim.T; if (orbAnim.ph >= 1){ orbAnim.ph -= 1; orbAnim.cyc++; }
  if (st !== orbAnim.st || now - orbAnim.colAt > 1000){
    orbAnim.tcol = orbColors(st); orbAnim.colAt = now;
    if (st !== orbAnim.st){ orbAnim.st = st; const lb = wrap.querySelector('.orb3d-label'); if (lb) lb.textContent = t(ORB_LABEL[st]); wrap.setAttribute('aria-label', t(ORB_LABEL[st])); }
  }
  orbAnim.col = orbAnim.col.map((c, i) => c + (orbAnim.tcol[i] - c) * .08);
  orbAnim.a += orbAnim.sp * dt; orbAnim.t += dt;
  drawOrb(cv, orbAnim.a, orbAnim.ph, orbAnim.t, orbAnim.k, orbAnim.cyc, orbAnim.col, +cv.dataset.dpr || 1);
  orbAnim.raf = requestAnimationFrame(orbLoop);
}
function orb3dHtml(size){
  const dpr = Math.min(2, window.devicePixelRatio || 1), st = aiState();
  return `<div class="orb3d" data-orb-live data-state="${st}" role="img" aria-label="${t(ORB_LABEL[st])}" style="--s:${size}px"><canvas data-orb3d data-dpr="${dpr}" width="${Math.round(size * dpr)}" height="${Math.round(size * dpr)}"></canvas><span class="orb3d-label">${t(ORB_LABEL[st])}</span></div>`;
}
const orbMini = () => { const dpr = Math.min(2, window.devicePixelRatio || 1); return `<canvas data-orb3d-static data-dpr="${dpr}" width="${Math.round(28 * dpr)}" height="${Math.round(28 * dpr)}" style="width:28px;height:28px" aria-hidden="true"></canvas>`; };
const _renderAll7 = renderAll;
renderAll = function(){
  _renderAll7();
  document.querySelectorAll('canvas[data-orb3d-static]').forEach(cv => drawOrb(cv, .6, 0, 0, 0, 0, orbColors('idle'), +cv.dataset.dpr || 1));
  const cv = document.querySelector('canvas[data-orb3d]');
  if (!cv) return;
  if (RM()) drawOrb(cv, orbAnim.a, 0, 0, 0, 0, orbColors(cv.parentElement.dataset.state), +cv.dataset.dpr || 1);
  else if (!orbAnim.raf){ orbAnim.last = 0; orbAnim.st = ''; orbAnim.raf = requestAnimationFrame(orbLoop); }
};

/* ================= v8: Liquid Glass tab bar ================= */
/* the buttons are built once (and again only when the language changes) so the selection capsule
   is the same element from tab to tab and can glide instead of being redrawn */
function renderTabs(){
  const tb = $('#tabs');
  if (tb.dataset.k !== lang()){
    tb.innerHTML = `<span class="tab-pill" aria-hidden="true"><span class="tab-pill-in"><span class="tab-pill-body"></span><span class="tab-pill-lens"><span class="lens-row">${TABS.map(([k, l, i]) => `<span class="lens-tab">${ui(i, 22)}<span>${t(l)}</span></span>`).join('')}</span></span><span class="tab-pill-glare"></span></span></span>` +
      TABS.map(([k, l, i]) => `<button class="tab" data-act="tab" data-t="${k}">${ui(i, 22)}<span>${t(l)}</span></button>`).join('');
    tb.dataset.k = lang(); tb.dataset.first = '1';
  }
  tb.querySelectorAll('.tab').forEach(b => { const on = b.dataset.t === tab; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  placePill();
}
/* water-drop lens: a magnified copy of the bar, counter-moved so the bubble shows exactly what is under it */
const LENS = 1;
function setPill(pill, x, w){
  pill.style.width = w + 'px'; pill.style.transform = `translateX(${x}px)`;
  const row = pill.querySelector('.lens-row'), tb = $('#tabs');
  if (row){
    /* the copy is LENS times bigger; shift it so the point under the bubble's centre lands in the bubble's centre */
    const W = tb.clientWidth, H = tb.clientHeight, ph = pill.offsetHeight || H - 12;
    pill.style.setProperty('--gx', (w * .08).toFixed(1) + 'px'); pill.style.setProperty('--gy', (ph * .21).toFixed(1) + 'px');
    row.style.width = W * LENS + 'px'; row.style.height = H * LENS + 'px';
    row.style.top = Math.round(ph / 2 - (H / 2) * LENS) + 'px';
    row.style.transform = `translateX(${Math.round(w / 2 - (x + w / 2) * LENS)}px)`;
  }
}
function placePill(force){
  const tb = $('#tabs'), pill = tb && tb.querySelector('.tab-pill'), on = tb && tb.querySelector('.tab.on');
  if (!pill || !on || !on.offsetWidth) return;
  const x = on.offsetLeft, w = on.offsetWidth, instant = force || tb.dataset.first === '1' || RM();
  const moved = pill.dataset.x !== undefined && +pill.dataset.x !== x;
  if (instant) pill.classList.add('instant');
  setPill(pill, x, w);
  if (instant){ void pill.offsetWidth; pill.classList.remove('instant'); tb.dataset.first = ''; }
  else if (moved){ pill.classList.remove('moving'); void pill.offsetWidth; pill.classList.add('moving'); clearTimeout(placePill.tm); placePill.tm = setTimeout(() => pill.classList.remove('moving'), 560); }
  pill.dataset.x = x;
}
window.addEventListener('resize', () => placePill(true));
/* grab the bubble: it swells, follows the finger, and on release snaps to the nearest tab and opens it */
(() => {
  const bar = $('#tabs');
  let drag = null, suppress = 0;
  const tabsEls = () => [...bar.querySelectorAll('.tab')];
  bar.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const pill = bar.querySelector('.tab-pill'), on = bar.querySelector('.tab.on');
    if (!pill || !on) return;
    const br = bar.getBoundingClientRect(), x0 = pill.dataset.x !== undefined ? +pill.dataset.x : on.offsetLeft, w = on.offsetWidth, px = e.clientX - br.left;
    if (px < x0 - 6 || px > x0 + w + 6) return;
    drag = {id: e.pointerId, sx: e.clientX, x0, w, x: x0, active: false};
    try { bar.setPointerCapture(e.pointerId); } catch(_){}
  });
  bar.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const pill = bar.querySelector('.tab-pill'), dx = e.clientX - drag.sx;
    if (!drag.active){
      if (Math.abs(dx) < 4) return;
      drag.active = true; pill.classList.remove('moving'); pill.classList.add('dragging'); pill.classList.add('instant'); bar.classList.add('grabbing');
    }
    const T = tabsEls(), min = T[0].offsetLeft, max = T[T.length - 1].offsetLeft;
    drag.x = Math.max(min, Math.min(max, drag.x0 + dx));
    setPill(pill, drag.x, drag.w);
    const c = drag.x + drag.w / 2;
    T.forEach(b => b.classList.toggle('drag-over', Math.abs(b.offsetLeft + b.offsetWidth / 2 - c) < b.offsetWidth / 2));
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (!d.active) return;
    suppress = Date.now();
    const pill = bar.querySelector('.tab-pill'), T = tabsEls();
    bar.classList.remove('grabbing'); pill.classList.remove('dragging'); void pill.offsetWidth; pill.classList.remove('instant');
    T.forEach(b => b.classList.remove('drag-over'));
    const c = d.x + d.w / 2, target = T.reduce((best, b) => Math.abs(b.offsetLeft + b.offsetWidth / 2 - c) < Math.abs(best.offsetLeft + best.offsetWidth / 2 - c) ? b : best, T[0]);
    pill.dataset.x = d.x;
    if (target.dataset.t !== tab) go(target.dataset.t); else placePill();
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
  /* a drag must not also count as a tap on the tab it ends on */
  document.addEventListener('click', e => { if (Date.now() - suppress < 350 && e.target.closest && e.target.closest('#tabs')){ e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* standalone: no AI yet, so the orb stays calm instead of showing an error until someone actually asks */
if (window.NX_STANDALONE) aiState = function(){ if (chat.busy) return chat.streaming ? 'speaking' : 'thinking'; return chat.err ? 'error' : (aiFocused ? 'listening' : 'idle'); };
